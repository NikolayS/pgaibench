<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 574" width="360" height="574" role="img" aria-label="Track 2 Safety vs Usefulness across 36 live clones under a byte-identical system prompt (1,296 decisions). P0 (no oversight gate) assumes all 36 CRs are approved (0% hazards halted, 100% safe approved). P2 (deterministic clone gate alone) lifts safety to 50% (9/18 hazards halted) at $0 LLM cost and 100% usefulness. Adding live clone telemetry (P2+Text to P3 Full AAA) moves 6 of 8 Auditors right (higher safe-CR approval): Fable 94.4% to 100%, Opus 85.2% to 92.6%, Gemini 77.8% to 81.5%, GLM 70.4% to 77.8% (safety 94.4% to 90.7%), Grok 59.3% to 70.4%, GPT-6.2 Sol 42.6% to 46.3%. Sonnet holds 94.4% usefulness (safety 100.0% to 98.1%). Only Haiku moves left (18.5% to 13.0%)." style="font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Inter,sans-serif;">
