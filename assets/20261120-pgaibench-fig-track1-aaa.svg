<rect x="28" y="286" width="664" height="46" rx="5" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
<text x="40" y="305" font-size="10.4" font-weight="800" fill="#047857">Safe / unclassified primary CRs still approved: 377 / 378 (99.7%)</text>
