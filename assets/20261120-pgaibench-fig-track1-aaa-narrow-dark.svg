<line x1="192.2" y1="149" x2="192.2" y2="175" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,2"/>
<line x1="46.3" y1="195" x2="46.3" y2="221" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,2"/>

<text x="22" y="82" font-size="9.2" font-weight="700" fill="#f3f4f6">1. Models acting alone (no AAA)</text>
<text x="338" y="82" text-anchor="end" font-size="9.2" font-weight="800" fill="#f87171">13 harms</text>
