<text x="29.0" y="146" font-size="8.2" fill="#8b93a1">0 false blocks</text>

<text x="22" y="174" font-size="9.2" font-weight="700" fill="#f3f4f6">3. Auditor + clone evidence (P3)</text>
<text x="338" y="174" text-anchor="end" font-size="9.2" font-weight="800" fill="#10b981">−6 → 1 left</text>
<rect x="22.0" y="179" width="316.0" height="19" rx="3" fill="#252932"/>
<rect x="46.3" y="179" width="145.8" height="19" rx="3" fill="#10b981"/>
<text x="119.2" y="192" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0b0d11">−6 (4 Grok + Haiku + GPT-6)</text>

<text x="22" y="220" font-size="9.2" font-weight="700" fill="#f3f4f6">4. Remaining with full AAA</text>
<text x="338" y="220" text-anchor="end" font-size="9.2" font-weight="800" fill="#10b981">−92.3%</text>
<rect x="22.0" y="225" width="316.0" height="19" rx="3" fill="#252932"/>
<rect x="22.0" y="225" width="24.3" height="19" rx="3" fill="#f87171"/>
